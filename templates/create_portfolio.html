{% extends "base.html" %}

{% block title %}Créer un Portfolio - E-Portfolios{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width: 600px; margin: 0 auto;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Nouveau Portfolio</h2>
    <a href="/portfolios/" class="btn btn-secondary">Annuler</a>
  </div>

  <!-- Message affiché si l'utilisateur n'est pas connecté -->
  <div id="auth-required-msg" class="card" style="display: none; text-align: center; padding: 3rem; margin-top: 2rem;">
    <h3>🔒 Connexion requise</h3>
    <p style="color: var(--text-muted); margin: 1rem 0;">
      Vous devez être connecté pour créer un portfolio.
    </p>
    <a href="/login" class="btn">Se connecter →</a>
  </div>

  <!-- Formulaire de création (masqué par défaut, affiché si connecté) -->
  <div id="create-form-container" class="card delay-1 animate-fade-in" style="opacity: 0; margin-top: 2rem; display: none;">
    <form id="create-form" action="/portfolios/" method="post">
      <div class="form-group">
        <label for="name">Nom du portfolio</label>
        <input type="text" id="name" name="name" placeholder="Ex: Jean Dupont - Développeur Web" required>
      </div>

      <div class="form-group">
        <label for="formation">Formation actuelle</label>
        <input type="text" id="formation" name="formation" placeholder="Ex: Master Informatique" required>
      </div>

      <div class="form-group">
        <label for="github">Lien GitHub (optionnel)</label>
        <input type="url" id="github" name="github" placeholder="https://github.com/votre-profil">
      </div>

      <div class="form-group">
        <label for="linkedin">Lien LinkedIn (optionnel)</label>
        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/votre-profil">
      </div>

      <button type="submit" class="btn" id="create-submit" style="width: 100%; margin-top: 1rem;">Créer le portfolio</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { getAuth } from "firebase/auth";

    const auth = getAuth();
    const form = document.getElementById('create-form');
    const formContainer = document.getElementById('create-form-container');
    const authMsg = document.getElementById('auth-required-msg');

    // Affiche le formulaire seulement si connecté
    window.addEventListener('auth-state-changed', (e) => {
        if (e.detail.user) {
            formContainer.style.display = 'block';
            authMsg.style.display = 'none';
        } else {
            formContainer.style.display = 'none';
            authMsg.style.display = 'block';
        }
    });

    // Intercepter la soumission pour ajouter le token Firebase
    form.addEventListener('submit', async (e) => {
        const user = auth.currentUser;
        if (!user) {
            e.preventDefault();
            window.location.href = '/login';
            return;
        }

        e.preventDefault();
        const btn = document.getElementById('create-submit');
        btn.disabled = true;
        btn.textContent = 'Création en cours...';

        try {
            const token = await user.getIdToken();
            const formData = new FormData(form);

            const response = await fetch('/portfolios/', {
                method: 'POST',
                body: formData,
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok || response.redirected) {
                window.location.href = '/portfolios/';
            } else {
                const data = await response.json();
                alert(data.detail || 'Erreur lors de la création.');
                btn.disabled = false;
                btn.textContent = 'Créer le portfolio';
            }
        } catch (error) {
            console.error('Erreur:', error);
            btn.disabled = false;
            btn.textContent = 'Créer le portfolio';
        }
    });
</script>
{% endblock %}
