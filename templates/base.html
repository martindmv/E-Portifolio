<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Portfolios{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />

    <!-- ===================================================== -->
    <!-- Firebase SDK v10 (modulaire) — Import Map CDN         -->
    <!-- ===================================================== -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js"
        }
    }
    </script>
</head>

<body>
    <nav>
        <a href="/portfolios/" class="brand">✨ E-Portfolios</a>
        <div class="nav-links">
            <a href="/portfolios/">Accueil</a>
            <a href="/portfolios/create" id="nav-create-link" class="btn"
               style="padding: 0.5rem 1rem; margin-left: 1rem; display: none;">Créer</a>

            <!-- Liens d'authentification — affichés/masqués par JavaScript -->
            <span id="nav-user-email" class="nav-user-email" style="display:none;"></span>
            <a href="/login" id="nav-login-link" style="display:none; margin-left: 1rem;">Connexion</a>
            <button id="nav-logout-btn" class="btn-logout" style="display:none;" onclick="window.firebaseLogout()">
                Déconnexion
            </button>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- ===================================================== -->
    <!-- Firebase : Initialisation + gestion de l'état auth    -->
    <!-- ===================================================== -->
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged, signOut } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyB0m5QAL85niS0gCkNot8Bkrlirntp_9cg",
            authDomain: "e-portfolio-34a46.firebaseapp.com",
            projectId: "e-portfolio-34a46",
            storageBucket: "e-portfolio-34a46.firebasestorage.app",
            messagingSenderId: "64815364364",
            appId: "1:64815364364:web:dfb1a190c0c516da6d7129"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Met à jour les liens de la navbar selon l'état de connexion
        onAuthStateChanged(auth, (user) => {
            const loginLink = document.getElementById('nav-login-link');
            const logoutBtn = document.getElementById('nav-logout-btn');
            const userEmail = document.getElementById('nav-user-email');
            const createLink = document.getElementById('nav-create-link');

            if (user) {
                if (loginLink) loginLink.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'inline-block';
                if (createLink) createLink.style.display = 'inline-block';
                if (userEmail) {
                    userEmail.style.display = 'inline';
                    userEmail.textContent = user.email;
                }
                // UID global accessible par les scripts enfants (portfolio_detail, etc.)
                window.__FIREBASE_UID__ = user.uid;
            } else {
                if (loginLink) loginLink.style.display = 'inline';
                if (logoutBtn) logoutBtn.style.display = 'none';
                if (createLink) createLink.style.display = 'none';
                if (userEmail) userEmail.style.display = 'none';
                window.__FIREBASE_UID__ = null;
            }

            // Dispatch un événement pour que les pages enfants réagissent
            window.dispatchEvent(new CustomEvent('auth-state-changed', { detail: { user } }));
        });

        // Fonction de déconnexion globale (appelée par le bouton nav)
        window.firebaseLogout = async function () {
            await signOut(auth);
            window.location.href = '/login';
        };
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
