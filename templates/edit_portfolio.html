{% extends "base.html" %}

{% block title %}Modifier {{ portfolio.name }}{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width: 600px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Modifier le portfolio</h2>
        <a href="/portfolios/{{ portfolio.id }}" class="btn btn-secondary">Annuler</a>
    </div>

    <div class="card delay-1 animate-fade-in" style="opacity: 0; margin-top: 2rem;">
        <form action="/portfolios/{{ portfolio.id }}/edit" method="post">
            <div class="form-group">
                <label for="name">Nom du portfolio</label>
                <input type="text" id="name" name="name" value="{{ portfolio.name }}" required>
            </div>

            <div class="form-group">
                <label for="formation">Formation actuelle</label>
                <input type="text" id="formation" name="formation" value="{{ portfolio.formation }}" required>
            </div>

            <div class="form-group">
                <label for="github">Lien GitHub (optionnel)</label>
                <input type="url" id="github" name="github" value="{{ portfolio.github or '' }}">
            </div>

            <div class="form-group">
                <label for="linkedin">Lien LinkedIn (optionnel)</label>
                <input type="url" id="linkedin" name="linkedin" value="{{ portfolio.linkedin or '' }}">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">
                Sauvegarder les modifications
            </button>
        </form>
    </div>
</div>
{% endblock %}
